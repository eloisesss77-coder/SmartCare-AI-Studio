services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anban-guardian-backend
    restart: unless-stopped
    network_mode: "host"
    environment:
      DATABASE_URL: ${ANBAN_DB_URL:-mysql+pymysql://smartcare:SmartCare%402026DB%21@127.0.0.1:3306/smartcare}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DINGTALK_WEBHOOK_URL: ${DINGTALK_WEBHOOK_URL:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_TEMPLATE_ALERT: ${WECHAT_TEMPLATE_ALERT:-}
      WECHAT_TEMPLATE_HEALTH: ${WECHAT_TEMPLATE_HEALTH:-}
      TZ: Asia/Shanghai
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    container_name: anban-guardian-frontend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
