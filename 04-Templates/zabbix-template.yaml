# ============================================================
# Zabbix Template 模板 — 安伴 Guardian 毫米波雷达监控
# ============================================================
# Item Key 规范: smartcare.radar.<metric>[{$ELDER_ID}]
# Host 命名规范: Elder-{elder_id}
# 数据来源: radar-collector ZabbixDataSender → Zabbix Trapper
# ============================================================

template:
  name: "Template SmartCare Radar Monitor"
  description: "安伴 Guardian 毫米波雷达监控模板 — 心率/呼吸/跌倒/在床/体态"
  groups:
    - "SmartCare/Radar"

  # ---- 宏变量（按实际环境调整）----
  macros:
    - macro: "{$ELDER_ID}"
      value: "1"
      description: "老人ID（Host 创建时覆盖）"
    - macro: "{$ELDER_NAME}"
      value: "未命名"
      description: "老人姓名"

    # 跌倒阈值
    - macro: "{$FALL_STATUS_THRESHOLD}"
      value: "1"
      description: "跌倒判定值: 0=正常, 1=跌倒"

    # 心率安全范围 (bpm)
    - macro: "{$HEART_RATE_MIN}"
      value: "40"
      description: "心率下限(次/分钟)，低于此值触发告警"
    - macro: "{$HEART_RATE_MAX}"
      value: "120"
      description: "心率上限(次/分钟)，高于此值触发告警"

    # 呼吸率安全范围 (次/分钟)
    - macro: "{$BREATH_RATE_MIN}"
      value: "10"
      description: "呼吸率下限"
    - macro: "{$BREATH_RATE_MAX}"
      value: "30"
      description: "呼吸率上限"

    # 离床检测
    - macro: "{$OUT_OF_BED_MAX_MINUTES}"
      value: "30"
      description: "离床超时告警阈值(分钟)"

    # 离线检测
    - macro: "{$DEVICE_OFFLINE_MINUTES}"
      value: "30"
      description: "设备无数据上报超时(分钟)"

  # ---- 监控项 ----
  items:
    - name: "雷达主数据(JSON)"
      key: "smartcare.radar.main_data[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "TEXT"
      delay: "0"
      history: "90d"
      description: "雷达上报的完整 JSON 数据包"

    - name: "跌倒状态"
      key: "smartcare.radar.fall_status[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "UNSIGNED"
      delay: "0"
      history: "90d"
      trends: "365d"
      value_map:
        0: "正常"
        1: "跌倒"
      description: "0=正常, 1=跌倒"

    - name: "心率"
      key: "smartcare.radar.heart_rate[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "FLOAT"
      units: "bpm"
      delay: "0"
      history: "90d"
      trends: "365d"
      description: "实时心率(次/分钟)"

    - name: "呼吸率"
      key: "smartcare.radar.breath_rate[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "FLOAT"
      units: "次/分钟"
      delay: "0"
      history: "90d"
      trends: "365d"
      description: "实时呼吸率(次/分钟)"

    - name: "活动等级"
      key: "smartcare.radar.activity_level[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "TEXT"
      delay: "0"
      history: "90d"
      description: "stationary/slight/moderate/vigorous"

    - name: "是否在床"
      key: "smartcare.radar.in_bed[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "UNSIGNED"
      delay: "0"
      history: "90d"
      value_map:
        0: "不在床"
        1: "在床"
      description: "0=不在床, 1=在床"

    - name: "体态"
      key: "smartcare.radar.body_posture[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "TEXT"
      delay: "0"
      history: "90d"
      description: "lying/sitting/standing/walking"

    - name: "设备在线状态"
      key: "smartcare.radar.online[{$ELDER_ID}]"
      type: "TRAP"
      value_type: "UNSIGNED"
      delay: "0"
      history: "7d"
      value_map:
        0: "离线"
        1: "在线"
      description: "设备心跳: 0=离线, 1=在线"

  # ---- 触发器 ----
  triggers:
    - name: "{$ELDER_NAME} 发生跌倒"
      severity: "DISASTER"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.fall_status[{$ELDER_ID}])={$FALL_STATUS_THRESHOLD}"
      description: "毫米波雷达检测到老人跌倒事件，请立即响应"
      tags:
        - tag: "alert_type"
          value: "fall"
        - tag: "severity"
          value: "emergency"

    - name: "{$ELDER_NAME} 心率异常偏低"
      severity: "HIGH"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.heart_rate[{$ELDER_ID}])<{$HEART_RATE_MIN}"
      description: "心率低于安全下限 {$HEART_RATE_MIN} bpm"
      tags:
        - tag: "alert_type"
          value: "heart_rate_low"
        - tag: "severity"
          value: "critical"

    - name: "{$ELDER_NAME} 心率异常偏高"
      severity: "HIGH"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.heart_rate[{$ELDER_ID}])>{$HEART_RATE_MAX}"
      description: "心率高于安全上限 {$HEART_RATE_MAX} bpm"
      tags:
        - tag: "alert_type"
          value: "heart_rate_high"
        - tag: "severity"
          value: "critical"

    - name: "{$ELDER_NAME} 呼吸率异常偏低"
      severity: "WARNING"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.breath_rate[{$ELDER_ID}])<{$BREATH_RATE_MIN}"
      description: "呼吸率低于下限 {$BREATH_RATE_MIN} 次/分钟"
      tags:
        - tag: "alert_type"
          value: "breath_rate_low"
        - tag: "severity"
          value: "warning"

    - name: "{$ELDER_NAME} 呼吸率异常偏高"
      severity: "WARNING"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.breath_rate[{$ELDER_ID}])>{$BREATH_RATE_MAX}"
      description: "呼吸率高于上限 {$BREATH_RATE_MAX} 次/分钟"
      tags:
        - tag: "alert_type"
          value: "breath_rate_high"
        - tag: "severity"
          value: "warning"

    - name: "{$ELDER_NAME} 离床超时"
      severity: "WARNING"
      expression: "last(/Template SmartCare Radar Monitor/smartcare.radar.in_bed[{$ELDER_ID}])<>1 and nodata(/Template SmartCare Radar Monitor/smartcare.radar.in_bed[{$ELDER_ID}],{$OUT_OF_BED_MAX_MINUTES}m)=1"
      description: "老人超过 {$OUT_OF_BED_MAX_MINUTES} 分钟不在床"
      tags:
        - tag: "alert_type"
          value: "out_of_bed"
        - tag: "severity"
          value: "warning"

    - name: "{$ELDER_NAME} 雷达设备离线"
      severity: "AVERAGE"
      expression: "nodata(/Template SmartCare Radar Monitor/smartcare.radar.main_data[{$ELDER_ID}],{$DEVICE_OFFLINE_MINUTES}m)=1"
      description: "设备超过 {$DEVICE_OFFLINE_MINUTES} 分钟未上报数据，请检查设备"
      tags:
        - tag: "alert_type"
          value: "device_offline"
        - tag: "severity"
          value: "info"

  # ---- 图形 ----
  graphs:
    - name: "{$ELDER_NAME} 心率—24小时趋势"
      width: 900
      height: 200
      items:
        - "smartcare.radar.heart_rate[{$ELDER_ID}]"

    - name: "{$ELDER_NAME} 呼吸率—24小时趋势"
      width: 900
      height: 200
      items:
        - "smartcare.radar.breath_rate[{$ELDER_ID}]"
